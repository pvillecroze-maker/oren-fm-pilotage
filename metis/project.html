<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09131f"><title>MÉTIS · Projet</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#e4f2f0;background:#09131f}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:24px 18px 80px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #355260;padding-bottom:17px}a{color:#8ee3d6}h1{font-weight:450;font-size:clamp(32px,7vw,58px);margin:30px 0 10px}h2{font-size:19px;font-weight:500}.muted{color:#9eb4bd}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0}.stat,.card{background:#102535;border:1px solid #2d4a59;border-radius:12px;padding:18px}.stat strong{font-size:26px;display:block;color:#d6c292}.cards{display:grid;gap:12px}.card h3{font-size:16px;font-weight:550;margin:0 0 10px}.card p{margin:7px 0;font-size:13px}.links{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.links a{border:1px solid #417f7e;padding:11px 14px;border-radius:9px;text-decoration:none}.empty{border:1px dashed #496273;border-radius:12px;padding:25px;color:#9eb4bd}.eyebrow{font-size:11px;letter-spacing:.2em;color:#7ad8c7}@media(max-width:520px){.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:22px}}</style></head><body><main><header><a href="/metis/index.html">← MÉTIS / Pilotage</a><a href="/janus.html">JANUS ↗</a></header><div class="eyebrow" style="margin-top:30px">OREN · FICHE PROJET DYNAMIQUE</div><h1 id="title">Projet</h1><p class="muted" id="summary">Chargement des données locales…</p><div class="links" id="links"></div><div class="stats" id="stats"></div><h2>Actions du projet</h2><div class="cards" id="tasks"></div><p class="muted" style="margin-top:25px;font-size:12px">Les données proviennent de la matrice MÉTIS de ce navigateur. Elles ne sont pas synchronisées automatiquement entre domaines ou appareils.</p></main><script>
const params=new URLSearchParams(location.search),project=(params.get('project')||'').trim().slice(0,100);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const refs=[{test:/argos|reseau|contacts/i,name:'ARGOS · réseau',url:'https://argos-network.vercel.app/'},{test:/pheme|opinion|observatoire/i,name:'PHÈMÉ · observatoire',url:'https://argos-oren-opinion-toulon.vercel.app/observatoire.html'},{test:/music|musique|apollon/i,name:'MÉTIS · musique',url:'/music/index.html'},{test:/olympos|drive|archive/i,name:'OLYMPOS · documents',url:'https://drive.google.com/drive/folders/1OChr2bZfJb8A9CLB4hMgZQ6Wq0aWH0Lu'}];
function draw(){
 let data={};try{data=JSON.parse(localStorage.getItem('metis-oren-v3-private')||localStorage.getItem('metis-v1-private')||'{}')}catch{}
 const tasks=Array.isArray(data.tasks)?data.tasks.filter(t=>slug(t.project)===slug(project)):[];
 document.title='MÉTIS · '+(project||'Projet');document.getElementById('title').textContent=project||'Projet non renseigné';
 const done=tasks.filter(t=>t.status==='Terminé').length,open=tasks.length-done;
 document.getElementById('summary').textContent=tasks.length+' action(s) · données mises à jour '+(data.updated?new Date(data.updated).toLocaleString('fr-FR'):'non datées');
 const stats=[['Actions',tasks.length],['À suivre',open],['Terminées',done]];
 document.getElementById('stats').innerHTML=stats.map(([label,num])=>'<div class="stat"><strong>'+num+'</strong>'+esc(label)+'</div>').join('');
 const links=document.getElementById('links');links.replaceChildren();
 for(const ref of refs){if(ref.test.test(project)){const a=document.createElement('a');a.href=ref.url;a.textContent='Ouvrir '+ref.name+' ↗';if(ref.url.startsWith('http')){a.target='_blank';a.rel='noopener noreferrer'}links.appendChild(a)}}
 const list=document.getElementById('tasks');
 list.innerHTML=tasks.length?tasks.sort((a,b)=>String(a.due||'9999').localeCompare(String(b.due||'9999'))).map(t=>'<article class="card"><h3>'+esc(t.title)+'</h3><p class="muted">'+esc(t.status)+' · '+esc(t.due||'Sans échéance')+'</p>'+(t.details?'<p>'+esc(t.details)+'</p>':'')+(t.mail&&/^https:\/\//.test(t.mail)?'<p><a target="_blank" rel="noopener noreferrer" href="'+esc(t.mail)+'">Courriel ↗</a></p>':'')+'</article>').join(''):'<div class="empty">Aucune action enregistrée pour ce projet dans ce navigateur. Ajoute une tâche dans MÉTIS en lui attribuant ce nom de projet.</div>';
}
window.addEventListener('storage',draw);document.addEventListener('visibilitychange',()=>{if(!document.hidden)draw()});draw();
</script></body></html>
