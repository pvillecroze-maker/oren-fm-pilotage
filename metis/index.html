<script>const ORIGINAL={"tasks":[],"events":[],"mails":[],"snapshot":null};
const STORE="metis-oren-v3-private";const LEGACY_STORE="metis-v1-private";const TIMER_STORE="metis-oren-v3-timer";const VIEWS=["today","matrix","agenda","mail","music","settings"];
let state={tasks:[],events:[],mails:[],snapshot:null,updated:null,tab:"today",query:"",filter:"all",timer:null};
try{
 const s=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(LEGACY_STORE)||'null');
 if(s&&Array.isArray(s.tasks)){
   state.tasks=s.tasks;state.events=Array.isArray(s.events)?s.events:[];state.mails=Array.isArray(s.mails)?s.mails:[];
   state.snapshot=s.snapshot||null;state.updated=s.updated||null;
 }
 const timer=JSON.parse(localStorage.getItem(TIMER_STORE)||'null');
 if(timer?.id&&Number.isFinite(timer.since)&&state.tasks.some(t=>t.id===timer.id))state.timer=timer;
}catch(e){}
function save(){
 state.updated=new Date().toISOString();
 try{localStorage.setItem(STORE,JSON.stringify({tasks:state.tasks,events:state.events,mails:state.mails,snapshot:state.snapshot,updated:state.updated,version:3}));}
 catch(e){alert('Stockage indisponible : exporte une sauvegarde pour éviter toute perte.');}
 render();
}
function timerText(){if(!state.timer)return '';let secs=Math.max(0,Math.floor((Date.now()-state.timer.since)/1000));return `${pad(Math.floor(secs/3600))}:${pad(Math.floor(secs%3600/60))}:${pad(secs%60)}`;}
function startTimer(id){
 if(state.timer&&state.timer.id!==id){alert('Arrête d’abord le chronomètre en cours.');return;}
 state.timer={id,since:Date.now()};
 try{localStorage.setItem(TIMER_STORE,JSON.stringify(state.timer));}catch(e){}
 render();
}
function stopTimer(id){
 if(!state.timer||state.timer.id!==id)return;
 const t=state.tasks.find(x=>x.id===id),seconds=Math.max(0,Math.round((Date.now()-state.timer.since)/1000));
 if(t){t.actualSeconds=Math.max(0,Number(t.actualSeconds??Number(t.actual||0)*60)||0)+seconds;t.actual=Math.round(t.actualSeconds/60);}
 state.timer=null;try{localStorage.removeItem(TIMER_STORE);}catch(e){}save();
}
function parseCsv(raw){
 const rows=[];let row=[],field='',quote=false;
 raw=raw.replace(/^\uFEFF/,'');
 for(let i=0;i<raw.length;i++){
 const ch=raw[i];
 if(ch==='"') {if(quote&&raw[i+1]==='"'){field+='"';i++}else quote=!quote;}
 else if(ch===','&&!quote){row.push(field);field='';}
 else if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&raw[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field='';}
 else field+=ch;
 }
 if(quote)throw Error('CSV non valide : guillemets non fermés');
 row.push(field);if(row.some(x=>x.trim()))rows.push(row);
 return rows;
}
function csvDate(src){
 const s=String(src||'').trim(),m=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?(?:\s+(\d{1,2}):(\d{2}))?/);
 if(!m)return '';
 const year=m[3]||String(new Date().getFullYear());
 return `${year}-${pad(m[2])}-${pad(m[1])}T${pad(m[4]||9)}:${m[5]||'00'}`;
}
function importCsv(raw){
 const rows=parseCsv(raw);const head=rows.shift()?.map(x=>x.trim());
 const col=name=>head.indexOf(name),val=(r,k)=>String(r[col(k)]??'').trim();
 if(!head||col('ACTION EXPLICITE')<0||col('PROJET')<0)throw Error('Sélectionne le CSV de l’onglet MATRICE MOBILE');
 let result=rows.filter(r=>val(r,'ACTION EXPLICITE')).map((r,i)=>({
 id:'csv-'+i+'-'+(val(r,'ACTION EXPLICITE').length), title:val(r,'ACTION EXPLICITE'),project:val(r,'PROJET')||'À classer',
 important:val(r,'IMPORTANT').toLowerCase()==='oui',urgent:val(r,'URGENT').toLowerCase()==='oui',
 status:val(r,'STATUT (modifier)')||'À faire',due:csvDate(val(r,'ÉCHÉANCE')),
 estimate:Math.max(0,Number(val(r,'PRÉVU (min)'))||0),actual:Math.max(0,Number(val(r,'RÉEL (min)'))||0),
 details:val(r,'NOTE / DÉCISION'),owner:val(r,'RESPONSABLE'),mail:'',calendar:'',kind:'work'
 }));
 if(!result.length||result.length>2000)throw Error('Le CSV ne contient pas d’actions exploitables');
 return result;
}
const pad=n=>String(n).padStart(2,"0");const escapeHtml=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeLink=u=>{try{let v=new URL(u);return v.protocol==="https:"?v.href:""}catch(e){return ""}};
function ddate(s){return s?new Date(s.length===16?s+":00":s):null}
function fmtDate(s){let d=ddate(s);if(!d||isNaN(d))return "Sans échéance";return new Intl.DateTimeFormat("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(d)}
function userToday(){return new Intl.DateTimeFormat("fr-FR",{timeZone:"Europe/Paris",weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date())}
function overdue(t){let d=ddate(t.due);return t.status!=="Terminé"&&d&&d.getTime()<Date.now()}
function soon(t){let d=ddate(t.due);return t.status!=="Terminé"&&d&&d.getTime()>=Date.now()&&d.getTime()-Date.now()<48*3600e3}
function quad(t){let imp=Boolean(t.important),urg=Boolean(t.urgent)||Boolean(soon(t))||Boolean(overdue(t));return imp?(urg?"Q1":"Q2"):(urg?"Q3":"Q4")}
function openTasks(){return state.tasks.filter(t=>t.status!=="Terminé"&&t.status!=="Reporté")}
function sorted(tasks){return [...tasks].sort((a,b)=>{let A=quad(a),B=quad(b);if(A!==B)return A.localeCompare(B);let x=ddate(a.due)?.getTime()??Infinity,y=ddate(b.due)?.getTime()??Infinity;return x-y})}
const ICONS={today:'<path d="M3 10.5 12 3l9 7.5V21h-7v-7h-4v7H3Z"/>',matrix:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 7 9-7"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>'};
function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||'<path d="M9 18V5l12-2v13M9 8l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'}</svg>`}
function taskCard(t){const q=quad(t),done=t.status==="Terminé",due=t.due?fmtDate(t.due):"À planifier",links=[t.mail&&safeLink(t.mail)?`<a href="${safeLink(t.mail)}" target="_blank" rel="noopener noreferrer">Mail</a>`:"",t.calendar&&safeLink(t.calendar)?`<a href="${safeLink(t.calendar)}" target="_blank" rel="noopener noreferrer">Agenda</a>`:""].filter(Boolean).join('');return `<article class="taskrow ${done?'isdone':''}"><button type="button" class="check ${done?'checked':''}" data-done="${escapeHtml(t.id)}" aria-label="${done?'Réouvrir':'Terminer'} la tâche ${escapeHtml(t.title)}">${done?'✓':''}</button><div class="taskcontent"><div class="tasktitle">${escapeHtml(t.title)}</div><div class="tasksub"><span>${escapeHtml(t.project)}</span><span>${escapeHtml(t.status)}</span>${t.owner&&t.owner!=='Patrick'?`<span>${escapeHtml(t.owner)}</span>`:''}</div><div class="taskactions"><button data-edit="${escapeHtml(t.id)}">Modifier</button><button data-timer-${state.timer?.id===t.id?'stop':'start'}="${escapeHtml(t.id)}">${state.timer?.id===t.id?'■ Arrêter chrono':'▶ Chrono'}</button>${links}</div></div><div class="rightmeta"><span class="quadrantmini">${q}</span><span class="due ${overdue(t)?'overdue':soon(t)?'soon':''}">${escapeHtml(due)}</span></div></article>`}
function eventLine(e){return `<div class="event"><div class="hour">${escapeHtml(e.time)}</div><div class="eventline ${e.conflict?'conflict':e.protected?'personal':''}"></div><div class="eventmain"><div class="eventtitle">${escapeHtml(e.title)}</div><div class="eventmeta">${escapeHtml(e.time)}–${escapeHtml(e.end)} · ${escapeHtml(e.tag)} ${e.conflict?'<span style="color:#efa9a0">· Conflit</span>':''}</div>${e.url?`<a href="${safeLink(e.url)}" target="_blank" rel="noopener noreferrer">Ouvrir l’événement ↗</a>`:''}</div></div>`}
function matrixStatusMatches(t){return state.statusView==='done'?t.status==='Terminé':state.statusView==='all'||t.status!=='Terminé';}
function render(){
window.metisMailPanelUpdate?.();
if(state.tab==='music'&&document.querySelector('#music-frame'))return;let t=sorted(state.tasks),active=openTasks(),done=state.tasks.filter(t=>t.status==='Terminé').length,waiting=state.tasks.filter(t=>t.status==='En attente').length,urg=active.filter(t=>quad(t)==='Q1').length,planned=active.reduce((s,t)=>s+(Number(t.estimate)||0),0),actual=state.tasks.reduce((s,t)=>s+(Number(t.actual)||0),0),stale=state.snapshot?Math.max(0,Math.floor((Date.now()-new Date(state.snapshot).getTime())/864e5)):null;
let title=state.tab==='today'?'Vue d’ensemble':state.tab==='matrix'?'Matrice des priorités':state.tab==='agenda'?'Agenda du jour':state.tab==='mail'?'Courriels à traiter':state.tab==='music'?'Music · SILLAGE':'Paramètres';
let out=`<header class="header"><div class="brand"><div class="brandmark">M</div><div><div class="brandtitle">MÉTIS</div><div class="brandmeta">OREN / PATRICK OS · STRATEGIC GRID</div></div></div><div class="topright"><button class="circlebtn" data-tab="settings" aria-label="Paramètres">${icon('settings')}</button><div class="avatar">OS</div></div></header><section class="hero"><div><div class="eyebrow"><span class="today">●</span> CENTRE DE COMMANDEMENT</div><h1>${title}</h1><div class="datebox">${escapeHtml(userToday())} · heure de Paris</div><p class="subtitle">Décider clairement, exécuter les priorités, préserver le temps personnel.</p></div><div class="heroactions"><button class="secondary" data-tab="matrix">Voir la matrice</button><button class="primary" data-add="true">+ Nouvelle action</button></div></section>
<div class="statusbar"><div><span class="tiny-dot"></span><strong>${window.metisGoogleConnected?.()?'GOOGLE CONNECTÉ · MÉTIS 4.4.0':'MODE LOCAL · MÉTIS 4.4.0'}</strong> · ${state.snapshot?`dernier instantané : ${escapeHtml(state.snapshot.slice(0,16).replace("T"," "))}`:"aucune source importée"} ${stale?`· ${stale} j sans actualisation`:""}</div><div>${window.metisGoogleConnected?.()?'Statuts reliés à Google Sheets':'Connecte Google pour synchroniser les statuts'}</div></div>${state.timer?`<div class="timerbar" role="status"><span>CHRONO ACTIF · ${escapeHtml(state.tasks.find(t=>t.id===state.timer.id)?.title||"Tâche")}</span><b>${timerText()}</b><button data-timer-stop="${escapeHtml(state.timer.id)}">Arrêter + enregistrer</button></div>`:""}`;
if(state.tab==='today'){
 if(!state.tasks.length)out+=`<section class="settingscard onboarding"><div class="eyebrow">01 // INITIALISATION PRIVÉE</div><h2>Ton tableau de bord, tes données.</h2><p>Aucune donnée personnelle n’est publiée avec l’application. Importe ta sauvegarde MÉTIS privée ou le CSV de l’onglet « MATRICE MOBILE » pour retrouver tes tâches.</p><button class="primary" data-import="true">Importer mes actions (.json / .csv)</button><p class="footinfo">Après import, les données sont conservées uniquement dans le navigateur de cet appareil.</p></section>`;
 out+=`<div class="dashboard"><div class="metric urgent"><div class="label">Q1 · À traiter</div><div class="value">${urg}</div><div class="hint">Actions ouvertes urgentes</div></div><div class="metric"><div class="label">En attente</div><div class="value">${waiting}</div><div class="hint">Retours ou décisions</div></div><div class="metric done"><div class="label">Terminées</div><div class="value">${done}<span class="muted" style="font-size:13px"> / ${state.tasks.length}</span></div><div class="hint">Statuts enregistrés</div></div><div class="metric time"><div class="label">Temps saisi</div><div class="value">${Math.floor(actual/60)}<span style="font-size:14px">h ${pad(actual%60)}</span></div><div class="hint">Prévu restant : ${Math.floor(planned/60)}h ${pad(planned%60)}</div></div></div>`;
 out+=`<div class="grid"><section><div class="sectionhead"><div><h2>Priorités immédiates</h2><p>Actions importantes et urgentes, classées par échéance</p></div><button class="textbtn" data-tab="matrix">Tout voir →</button></div>${active.filter(t=>quad(t)==='Q1').length?sorted(active.filter(t=>quad(t)==='Q1')).slice(0,6).map(taskCard).join(''):'<div class="empty">Aucune tâche urgente ouverte.</div>'}<div class="sectionhead"><div><h2>À planifier</h2><p>Projets de fond et candidatures importantes</p></div></div>${active.filter(t=>quad(t)==='Q2').length?sorted(active.filter(t=>quad(t)==='Q2')).slice(0,3).map(taskCard).join(''):'<div class="empty">Aucune tâche Q2 ouverte.</div>'}</section><section><div class="sectionhead"><div><h2>Planning importé</h2><p>Dernier instantané importé · non temps réel</p></div><button class="textbtn" data-tab="agenda">Voir →</button></div><div class="panel"><div class="timeline">${state.events.map(eventLine).join('')}</div></div><div class="warning">Les conflits horaires doivent être confirmés dans Google Agenda. MÉTIS ne déplace aucun rendez-vous.</div><div class="sectionhead"><div><h2>Courriels décisionnels</h2></div><button class="textbtn" data-tab="mail">Voir →</button></div><div class="panel">${state.mails.slice(0,4).map(m=>`<div class="mailrow"><div><h3>${escapeHtml(m.title)}</h3><p>${escapeHtml(m.state)}</p>${m.account?`<p>${escapeHtml(m.account)} · ${escapeHtml(m.reason||'')}</p><button class="secondary" data-mail-task="${escapeHtml(m.id)}">Créer une action</button>`:''}</div><a class="linkout" href="${safeLink(m.url)}" rel="noopener noreferrer" target="_blank">Ouvrir ↗</a></div>`).join('')}</div></section></div>`;
}else if(state.tab==='matrix'){
 let rows=state.tasks.filter(matrixStatusMatches).filter(t=>(state.filter==='all'||quad(t)===state.filter)&&(state.query.trim()===''||(`${t.title} ${t.project} ${t.owner} ${t.details}`).toLocaleLowerCase('fr').includes(state.query.toLocaleLowerCase('fr'))));
 out+=`<div class="toolbar"><label class="searchfield">⌕ <input id="search" type="search" placeholder="Rechercher une tâche, un projet…" value="${escapeHtml(state.query)}" aria-label="Rechercher"></label><select class="select" id="statusFilter" aria-label="Filtrer par statut">${[['active','À traiter'],['done','Terminées'],['all','Toutes les tâches']].map(([value,label])=>`<option value="${value}" ${(state.statusView||'active')===value?'selected':''}>${label}</option>`).join('')}</select><select class="select" id="filter" aria-label="Filtrer par quadrant"><option value="all">Tous les quadrants</option>${['Q1','Q2','Q3','Q4'].map(q=>`<option ${state.filter===q?'selected':''} value="${q}">${q} — ${q==='Q1'?'Faire':q==='Q2'?'Planifier':q==='Q3'?'Traiter':'Reporter'}</option>`).join('')}</select></div><div class="matrix">`;
 for(let [q,name,desc] of [['Q1','Faire','Important · Urgent'],['Q2','Planifier','Important · Non urgent'],['Q3','Traiter','Peu important · Urgent'],['Q4','Reporter','Peu important · Non urgent']]){let items=sorted(rows.filter(t=>quad(t)===q));out+=`<div class="quad ${q.toLowerCase()}"><div class="quadhead"><span class="quadlabel">${q}</span><div><div class="quadname">${name} <span class="muted">· ${items.length}</span></div><div class="quaddesc">${desc}</div></div></div>${items.length?items.map(taskCard).join(''):'<div class="empty">Aucune action dans ce quadrant.</div>'}</div>`}out+='</div><p class="footinfo">Les tâches terminées sont retirées de la vue À traiter. Retrouve-les avec le filtre Terminées. Une échéance dépassée ne signifie pas que la tâche est terminée. Les autres champs restent locaux ; les statuts sont enregistrés dans Sheets après connexion Google.</p>';
}else if(state.tab==='agenda'){
 out+=`<div class="grid"><div><div class="sectionhead"><div><h2>Agenda du jour</h2><p>Actualisation Google disponible dans le panneau de connexion</p></div></div><div class="panel"><div class="timeline">${state.events.map(eventLine).join('')}</div></div><div class="warning">MÉTIS affiche les événements importés sans vérifier leur validité actuelle ; ouvre Google Agenda pour confirmer avant toute décision.</div></div><div><div class="sectionhead"><div><h2>Accès direct</h2><p>Calendriers d’origine</p></div></div><div class="settingscard"><p>Ouvre Google Agenda pour consulter l’état réel. Les changements effectués dans MÉTIS ne modifient pas automatiquement Agenda.</p><a class="primary" href="https://calendar.google.com/calendar/u/0/r/day" target="_blank" rel="noopener noreferrer">Ouvrir Google Agenda ↗</a></div></div></div>`;
}else if(state.tab==='mail'){
 out+=`<div class="sectionhead"><div><h2>Actions issues des courriels</h2><p>Courriels à examiner · source Google ou import privé</p></div></div><div class="panel">${state.mails.map(m=>`<div class="mailrow"><div><span class="tag gray">${escapeHtml(m.tag)}</span><h3 style="margin-top:7px">${escapeHtml(m.title)}</h3><p>${escapeHtml(m.state)}</p>${m.account?`<p>${escapeHtml(m.account)} · ${escapeHtml(m.reason||'')}</p><button class="secondary" data-mail-task="${escapeHtml(m.id)}">Créer une action</button>`:''}</div><a class="linkout" href="${safeLink(m.url)}" target="_blank" rel="noopener noreferrer">Gmail ↗</a></div>`).join('')}</div><p class="footinfo">Une ouverture Mailtrack ou un accusé ne prouve ni lecture effective par la personne visée ni traitement de la demande.</p>`;
}else if(state.tab==='music'){
 out+=`<p class="footinfo">SILLAGE + MODULATION · bilan d’humeur, sessions musicales et export. La création dans Apple Music nécessite sa connexion dans les réglages SILLAGE.</p><iframe id="music-frame" title="SILLAGE Music et humeur" src="/music/index.html" style="width:100%;height:80vh;border:0;border-radius:16px" allow="autoplay; encrypted-media"></iframe><p><a href="/music/index.html" target="_blank" rel="noopener">Ouvrir Music en plein écran ↗</a></p>`;
}else{
 out+=`<div class="settingscard"><h3>Installable sur iPhone</h3><p>Une fois MÉTIS hébergée sur un site HTTPS privé, ouvre-le dans Safari, puis Partager → Sur l’écran d’accueil → Ouvrir comme application. Le téléchargement ZIP seul ne suffit pas à installer une PWA.</p><div class="settingsbuttons"><button class="secondary" id="install">Instructions d’installation</button></div><div id="installHelp" class="installhelp" hidden>Safari → Partager → Sur l’écran d’accueil → Ajouter. L’option est disponible depuis l’URL HTTPS déployée.</div></div>
 <div class="settingscard"><h3>Sauvegarde et transfert</h3><p>Les données sont actuellement enregistrées dans le navigateur de cet appareil (stockage local). Exporte un JSON pour sauvegarder ou transférer les changements vers un autre appareil.</p><div class="settingsbuttons"><button class="primary" id="export">Exporter MES DONNÉES (.json)</button><button class="secondary" id="import">Importer JSON / CSV</button><input type="file" id="fileinput" accept="application/json,text/csv,.json,.csv" hidden></div></div>
 <div class="settingscard"><h3>Sources Google : synchronisation</h3><p>Connecte Google pour charger les tâches de Sheets, les événements du jour et les courriels récents. Les statuts sont écrits dans Sheets après vérification. Les autres modifications de tâches restent locales.</p><span class="tag amber">Google · connexion requise</span></div>
 <div class="settingscard"><h3>Gestion des données</h3><p>${state.tasks.length} actions locales · ${state.updated?'Dernière modification : '+new Date(state.updated).toLocaleString('fr-FR'):'Aucune modification depuis l’import initial'}. Une réinitialisation supprime tes tâches de ce navigateur : exporte-les au préalable.</p><button class="secondary" id="reset">Effacer la copie locale</button></div>`;
}
 out+=`<nav class="bottomnav" aria-label="Navigation principale">${[['today','Accueil'],['matrix','Matrice'],['agenda','Agenda'],['mail','Mails'],['music','Music'],['settings','Réglages']].map(([v,label])=>`<button class="navitem ${v===state.tab?'active':''}" data-tab="${v}" aria-current="${v===state.tab?'page':'false'}">${icon(v)}${label}</button>`).join('')}<a class="navitem" href="https://argos-network.vercel.app/" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir ARGOS">◇ ARGOS</a></nav>`;
 document.getElementById('app').innerHTML=out;
}
function openModal(t){let empty={id:'t'+Date.now(),title:'',project:'',important:true,urgent:false,status:'À faire',due:'',estimate:30,actual:0,mail:'',calendar:'',owner:'Patrick',details:''};let x=t||empty;document.getElementById('modalTitle').textContent=t?'Modifier l’action':'Nouvelle action';document.getElementById('taskId').value=x.id;for(const key of ['title','project','status','due','estimate','actual','mail','calendar','owner','details']){document.getElementById('f_'+key).value=x[key]??''}document.getElementById('f_important').checked=!!x.important;document.getElementById('f_urgent').checked=!!x.urgent;document.getElementById('modalWrap').classList.add('open');document.getElementById('f_title').focus()}
function closeModal(){document.getElementById('modalWrap').classList.remove('open')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;state.query='';state.filter='all';render();scrollTo({top:0,behavior:'smooth'})}else if(b.dataset.add){openModal()}else if(b.dataset.done){let t=state.tasks.find(t=>t.id===b.dataset.done);if(t){const previous=t.status,next=previous==='Terminé'?'À faire':'Terminé';if(!window.metisUpdateTaskStatus){alert('Synchronisation Google indisponible. Aucun changement enregistré.');return;}b.disabled=true;const copy={...t,status:next};window.metisUpdateTaskStatus(copy,previous).then(()=>{t.status=next;save();}).catch(err=>{alert('Non enregistré : '+err.message);render();}).finally(()=>{b.disabled=false;});}}else if(b.dataset.edit){let t=state.tasks.find(t=>t.id===b.dataset.edit);if(t)openModal(t)}else if(b.dataset.timerStart){startTimer(b.dataset.timerStart)}else if(b.dataset.timerStop){stopTimer(b.dataset.timerStop)}else if(b.id==='closeModal'||b.id==='cancel'){closeModal()}else if(b.id==='export'){let data={app:'METIS',version:3,exportedAt:new Date().toISOString(),tasks:state.tasks,events:state.events,mails:state.mails,snapshot:state.snapshot};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='METIS_sauvegarde_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}else if(b.id==='import'||b.dataset.import){state.tab='settings';render();document.getElementById('fileinput').click()}else if(b.id==='install'){document.getElementById('installHelp').hidden=false}else if(b.id==='reset'){if(confirm('Effacer toutes les données locales ? Exporte une sauvegarde avant cette opération.')){state.tasks=[];state.events=[];state.mails=[];state.snapshot=null;state.timer=null;try{localStorage.removeItem(TIMER_STORE);}catch(e){}save()}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;state.query=e.target.value;render();let el=document.getElementById('search');el?.focus();el?.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{
 if(e.target.id==='statusFilter'){state.statusView=e.target.value;render();return;}
 if(e.target.id==='filter'){state.filter=e.target.value;render();return;}
 if(e.target.id!=='fileinput')return;
 const f=e.target.files?.[0];if(!f)return;
 try{
   let j;
   if(f.name.toLowerCase().endsWith('.csv'))j={tasks:importCsv(await f.text())};
   else j=JSON.parse(await f.text());
   if(!Array.isArray(j.tasks)||j.tasks.length>2000||j.tasks.some(t=>!t.id||!t.title||!t.status))throw Error('Fichier non reconnu');
   if(confirm('Remplacer les données locales par '+j.tasks.length+' actions ?')){
      state.tasks=j.tasks;state.events=Array.isArray(j.events)?j.events:[];
      state.mails=Array.isArray(j.mails)?j.mails:[];
      state.snapshot=j.snapshot||new Date().toISOString();
      state.timer=null;try{localStorage.removeItem(TIMER_STORE);}catch(e){}
      state.tab='today';save();
   }
 }catch(err){alert('Import impossible : '+err.message)}
 e.target.value='';
});
document.getElementById('taskForm').addEventListener('submit',async e=>{e.preventDefault();let el=id=>document.getElementById('f_'+id),id=document.getElementById('taskId').value;let existing=state.tasks.find(x=>x.id===id);let t=existing?{...existing}:{id};for(let key of ['title','project','status','due','mail','calendar','owner','details'])t[key]=el(key).value.trim();for(let key of ['estimate','actual'])t[key]=Math.max(0,Math.round(Number(el(key).value)||0));t.important=el('important').checked;t.urgent=el('urgent').checked;if(!t.title){alert('Indique le nom de la tâche.');return}if(!t.project)t.project='Sans projet';if(existing&&t.status!==existing.status){try{if(!window.metisUpdateTaskStatus)throw Error('Connexion Google indisponible.');await window.metisUpdateTaskStatus({...t,title:existing.title},existing.status);}catch(err){alert('Non enregistré : '+err.message);return;}}if(existing)Object.assign(existing,t);else state.tasks.push(t);closeModal();save()});
document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
render();setInterval(()=>{if(document.getElementById('modalWrap').classList.contains('open'))return;render()},60000);
